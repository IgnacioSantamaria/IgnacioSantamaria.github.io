<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.nav != 'home' %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta name="theme-color" content="#0f6b7a">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=Public+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{% if page.nav == 'home' %}Ignacio Santamaría{% else %}{{ site.title }}{% endif %}</a>
      <nav class="site-nav" aria-label="Main">
        <a href="{{ '/' | relative_url }}"{% if page.nav == 'home' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/publications/' | relative_url }}"{% if page.nav == 'publications' %} aria-current="page"{% endif %}>Publications</a>
        <a href="{{ '/projects/' | relative_url }}"{% if page.nav == 'projects' %} aria-current="page"{% endif %}>Projects</a>
        <a href="{{ '/cv/' | relative_url }}"{% if page.nav == 'cv' %} aria-current="page"{% endif %}>CV</a>
      </nav>
    </div>
  </header>

  <main id="main">
{{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. University of Cantabria, Santander, Spain.</span>
      <ul>
        <li><a href="mailto:{{ site.email }}">Email</a></li>
        <li><a href="{{ site.scholar }}" rel="noopener">Google Scholar</a></li>
        <li><a href="{{ site.linkedin }}" rel="noopener">LinkedIn</a></li>
        <li><a href="{{ site.github }}" rel="noopener">GitHub</a></li>
      </ul>
    </div>
  </footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
